# CI gate (PRD §12.6): nothing is deployed unless every job passes.
# Actions are referenced by major tag; pin them to commit SHAs before enabling deploys.
name: ci

on:
  push:
    # R2 phases are built on their own branches (docs/design/r2.md §5) and tested before they merge.
    branches: [main, staging, 'r2.*']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_USER: simola
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: simola_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U simola -d simola_test" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SIMOLA_TEST_DATABASE_URL: postgresql+asyncpg://simola:ci-only@localhost:5432/simola_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.2'
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check simola tests
      - run: uv run ruff format --check simola tests
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test
      - run: npx vite build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.2'
      - name: Python dependency audit
        working-directory: backend
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/req.txt && uvx pip-audit --disable-pip -r /tmp/req.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high

  e2e:
    # Browser tests (PRD §15.3) on the sample-data build; runs against staging are in docs/runbooks/testing.md.
    # Pinned: Playwright 1.62 supports Ubuntu 24.04, and ubuntu-latest is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  zap:
    # OWASP ZAP baseline (passive) scan, PRD §15.4, then a backup and restore check (NFR-BAK). The whole stack
    # runs on GitHub's runner with throwaway passwords: this job never reaches staging or production. It fails
    # on any High-risk alert, or if a backup does not restore.
    runs-on: ubuntu-latest
    env:
      SIMOLA_ENVIRONMENT: staging
      POSTGRES_PASSWORD: ci-only
      SIMOLA_APP_DB_USER: simola_app
      SIMOLA_APP_DB_PASSWORD: ci-only-app
      SIMOLA_CDP_ADDRESSES: '{}'
    steps:
      - uses: actions/checkout@v7
      - name: Backup commands with stand-in database tools
        run: sh deploy/backup/test.sh
      - name: Start database, API and web on the runner
        run: docker compose up -d --build --wait web
      - name: ZAP baseline scan
        run: |
          web=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q web)")
          mkdir -p zap && chmod a+rwx zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://$web:8080" -J zap.json -r zap.html -I
      - name: Fail on High-risk alerts
        run: |
          python3 - <<'PY'
          import json, sys
          alerts = [a for s in json.load(open("zap/zap.json"))["site"] for a in s["alerts"]]
          for a in sorted(alerts, key=lambda a: -int(a["riskcode"])):
              print(f'{a["riskdesc"]:<24} {a["alert"]}')
          high = [a for a in alerts if int(a["riskcode"]) >= 3]
          sys.exit(f"{len(high)} High-risk alert(s)" if high else 0)
          PY
      - name: Back up and check the restore on the runner (deploy/backup)
        run: |
          docker compose up -d --wait backup
          docker compose exec -T backup backup-now
          docker compose exec -T backup backup-verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report
          path: zap/
          retention-days: 14
      - if: always()
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, e2e, zap]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t simola-backend:ci backend
      - run: docker build -t simola-web:ci frontend
      - run: docker build -t simola-backup:ci deploy/backup

  # Deploys are triggered from CI (not by Coolify's push webhook) so untested code cannot reach an
  # environment. Enable once the Coolify apps exist and their deploy webhooks are stored as secrets.
