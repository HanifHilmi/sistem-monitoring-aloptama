  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: curl -fsS -X GET "${{ secrets.COOLIFY_STAGING_DEPLOY_URL }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
  # deploy-production:
