# SIMOLA - production and staging (one Coolify application each, PRD §12.2/12.3).
# Every value comes from the environment (see .env.example); nothing secret or host-specific is stored here.
# Deploy ONLY through Coolify. Do not declare `networks:` here: Coolify attaches its own resource network.
# Coolify creates that network without a subnet, so its range comes from the Docker daemon's address pools:
# the host must set `default-address-pools` to a range that cannot overlap the intranet (runbook, H-0),
# otherwise Docker's built-in 172.x/16 pool is used and can hijack intranet routes.
# Host folders use the long volume syntax with `${VAR:-default}`: that is the form Coolify resolves from the
# application's variables (a short "${VAR}:/path" is taken as a named volume, and "${VAR:?msg}" breaks its
# parser). Defaults are relative, i.e. inside Coolify's folder for this application, so a missing variable
# can never point two environments at the same data.

x-backend-env: &backend-env
  SIMOLA_ENVIRONMENT: ${SIMOLA_ENVIRONMENT:?set production or staging}
  SIMOLA_VERSION: ${SOURCE_COMMIT:-dev}
  SIMOLA_LOG_LEVEL: ${SIMOLA_LOG_LEVEL:-INFO}
  SIMOLA_DATABASE_URL: postgresql+asyncpg://${SIMOLA_APP_DB_USER:?}:${SIMOLA_APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:-simola}
  SIMOLA_BACKUP_EXPECTED: ${SIMOLA_BACKUP_EXPECTED:-false}

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simola_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-simola}
      TZ: UTC
    volumes:
      - type: bind
        source: ${SIMOLA_PG_DATA_DIR:-./data/pg}
        target: /var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: ${SIMOLA_DB_MEM:-1536m}
    # No "ports:" - the database is never published on the host (NFR-SEC-001).

  migrate:
    build: ./backend
    restart: "no"
    command: ["simola", "migrate"]
    environment:
      SIMOLA_ENVIRONMENT: ${SIMOLA_ENVIRONMENT:?}
      SIMOLA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-simola_owner}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-simola}
      SIMOLA_APP_DB_USER: ${SIMOLA_APP_DB_USER:?}
      SIMOLA_APP_DB_PASSWORD: ${SIMOLA_APP_DB_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Worker processes (uvicorn reads WEB_CONCURRENCY). One process answers one CPU-heavy request at a time,
      # so a 31-day chart would hold up every other request (load test 2026-11-04). Each process needs ~150 MB
      # and up to 5 database connections (budget in backend/simola/core/db.py).
      WEB_CONCURRENCY: ${SIMOLA_API_WORKERS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${SIMOLA_API_MEM:-512m}

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "simola.worker.main"]
    environment:
      <<: *backend-env
      SIMOLA_CDP_PATHS: '{"CDP1": "/mnt/cdp1", "CDP2": "/mnt/cdp2"}'
      SIMOLA_CDP_ADDRESSES: ${SIMOLA_CDP_ADDRESSES:?JSON map of CDP code to probe address}
    volumes:
      # Read-only: SIMOLA never writes to AWOS shares (NFR-SEC-006/009). The shares are mounted by the
      # host; nothing may create or change those paths, so a missing share fails the deploy instead.
      - type: bind
        source: ${SIMOLA_CDP1_SHARE:-./cdp-share-not-set/cdp1}
        target: /mnt/cdp1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SIMOLA_CDP2_SHARE:-./cdp-share-not-set/cdp2}
        target: /mnt/cdp2
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/simola-worker.alive') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: ${SIMOLA_WORKER_MEM:-512m}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 64m

  backup:
    build: ./deploy/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-simola_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-simola}
      BACKUP_ENABLED: ${SIMOLA_BACKUP_ENABLED:-false}
      BACKUP_HOUR_UTC: ${SIMOLA_BACKUP_HOUR_UTC:-18}
      BACKUP_KEEP_DAILY: "7"
      BACKUP_KEEP_WEEKLY: "4"
      BACKUP_KEEP_MONTHLY: "12"
      BACKUP_UPLOAD_CMD: ${SIMOLA_BACKUP_UPLOAD_CMD:-}
      BACKUP_RUN_ON_START: ${SIMOLA_BACKUP_RUN_ON_START:-false}
    volumes:
      - type: bind
        source: ${SIMOLA_BACKUP_DIR:-./data/backups}
        target: /backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m

